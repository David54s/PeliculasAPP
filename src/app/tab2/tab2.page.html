<ion-header class="ion-padding">
  <ion-toolbar>
    <ion-searchbar placeholder="Buscar Película"
                   animated=""
                   debounce="700"
                   [value]="textoBuscar"
                   (ionInput)="buscar($event)"></ion-searchbar></ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-grid fixed *ngIf="buscando">
    <ion-row>
      <ion-col class="ion-text-center">
        <ion-spinner name="crescent"></ion-spinner>
      </ion-col>
    </ion-row>
  </ion-grid>


  <ion-list *ngIf="peliculas.length === 0">
    <ion-list-header>
      <ion-label>Ideas</ion-label>
    </ion-list-header>

    <ion-item *ngFor="let idea of ideas" (click)="textoBuscar = idea">
      <ion-label color="primary">{{idea}}</ion-label>
    </ion-item>

  </ion-list>

  <ion-grid fixed>
    <ion-row>

      <ion-col size="6" *ngFor="let pelicula of peliculas">
        <ion-card class="custom-card" (click)="detalle(pelicula.id)">
          <img [src]="pelicula.poster_path | imagen" class="poster-image">

          <ion-card-header class="custom-header">
            <ion-card-subtitle class="custom-subtitle">{{pelicula.release_date | date: 'yyyy'}}</ion-card-subtitle>
          </ion-card-header>

          <ion-card-content class="custom-content">
            <h3 class="movie-title">{{pelicula.title}}</h3>
          </ion-card-content>
        </ion-card>
      </ion-col>

    </ion-row>
  </ion-grid>



</ion-content>
